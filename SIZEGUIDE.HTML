<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=1440PX, initial-scale=1.0">
    <title>SS Ｍｏｄａｌ 2025</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <section class="size-guide">

    <h2>SIZE GUIDE</h2>

    <div class="size-category">

        <h3>MEN'S AND WOMEN'S TOP'S</h3>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>SIZE</th>
                        <th>CHEST</th>
                        <th>LENGTH</th>
                        <th>WAIST</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>S</td>
                        <td>34"</td>
                        <td>29"</td>
                        <td>28"</td>
                    </tr>

                    <tr>
                        <td>M</td>
                        <td>36"</td>
                        <td>30"</td>
                        <td>30"</td>
                    </tr>

                    <tr>
                        <td>L</td>
                        <td>38"</td>
                        <td>31"</td>
                        <td>32"</td>
                    </tr>

                </tbody>
            </table>
        </div>

    </div>


    <div class="size-category">

        <h3>MEN'S AND WOMEN'S BOTTOM'S</h3>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>SIZE</th>
                        <th>WAIST</th>
                        <th>HIPS</th>
                        <th>INSEAM</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>S</td>
                        <td>30-31"</td>
                        <td>36"</td>
                        <td>30"</td>
                    </tr>

                    <tr>
                        <td>M</td>
                        <td>32-33"</td>
                        <td>38"</td>
                        <td>32"</td>
                    </tr>

                    <tr>
                        <td>L</td>
                        <td>34-35"</td>
                        <td>40"</td>
                        <td>34"</td>
                    </tr>

                </tbody>
            </table>
        </div>

    </div>

</section>

</body>
</html>
